<a class="skip-link" href="#content">{{ i18n.t().nav.skipToContent }}</a>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" routerLink="/">{{ profile.name }}</a>
    <app-lang-toggle />
  </div>
</header>

<main id="content" class="wrap" tabindex="-1">
  <router-outlet />
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <span>© {{ year }} {{ profile.name }}</span>
    <nav class="footer-links" [attr.aria-label]="i18n.t().legal.title">
      <a routerLink="/impressum">{{ i18n.t().footer.imprint }}</a>
      <a [href]="profile.links.github" target="_blank" rel="noopener noreferrer">GitHub</a>
    </nav>
  </div>
</footer>
